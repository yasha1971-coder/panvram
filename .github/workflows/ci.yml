name: CI (CPU path, synthetic fixtures)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libzstd-dev
      - name: torch (CPU wheel) and test tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest ninja
      - name: Build (CPU path)
        run: |
          set -euo pipefail
          PANVRAM_CUDA=0 python -m pip install -e . --no-build-isolation
          python -c "import panvram; assert not panvram.with_cuda; print('panvram', panvram.__version__)"
      - name: Synthetic tests (CPU)
        run: |
          set -euo pipefail
          ulimit -c 0
          cd tests && python -m pytest -q -rs test_synth.py
      - name: Gate test is skipped without a cohort
        run: |
          set -euo pipefail
          cd tests && python -m pytest -q -rs test_gate.py
